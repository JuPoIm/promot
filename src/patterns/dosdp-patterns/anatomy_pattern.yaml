pattern_name: anatomy_pattern

pattern_iri: http://purl.obolibrary.org/obo/promot/patterns/gene_disease_pattern.yaml

description: "Use this template to link the phenotypes to the anatomy they are related to."

contributors:
  - https://orcid.org/0009-0000-5160-7927 # J. Potier

classes:
  anatomy: FMA:62955
  structure: WHOFIC:1626363729

relations:
  related_to: BIOLINK:related_to

data_list_vars:
  orcid: xsd:anyURI

vars:
  anatomy: "'anatomy'"
  structure: "'structure'"
      
logical_axioms:
  - axiom_type: equivalentTo
    text: "'anatomy' and 'related_to' some %s"
    vars:
      - structure

  - axiom_type: subClassOf
    text: "'related_to' some %s"
    vars:
      - structure