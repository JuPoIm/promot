pattern_name: anatomy_pattern

pattern_iri: anatomy_pattern.yaml

description: "Use this template to link the anatomical entity to the phenotypes and body structures they are related to, the anatomical entity being the subject of the relation."

contributors:
  - https://orcid.org/0009-0000-5160-7927 # J. Potier

classes:
  anatomical_entity: http://purl.obolibrary.org/obo/FMA_62955
  body_structure: http://id.who.int/icd/entity/1626363729
  phenotypic_abnormality: HP:0000118

relations:
  located_in: RO:0001025
  has_disposition: RO:0000091

vars:
  structure: "'body_structure'"
  phenotype: "'phenotypic_abnormality'"

logical_axioms:

  - axiom_type: subClassOf
    text: "'located_in' some %s"
    vars:
      - structure

  - axiom_type: subClassOf
    text: "'has_disposition' some %s"
    vars:
      - phenotype