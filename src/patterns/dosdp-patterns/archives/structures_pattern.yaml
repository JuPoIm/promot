pattern_name: structures_pattern

pattern_iri: structures_pattern.yaml

description: "Use this template to link the body structures to the phenotypes and activities they are related to."

contributors:
  - https://orcid.org/0009-0000-5160-7927 # J. Potier

classes:
  body_structures: http://id.who.int/icd/entity/1626363729
  activities_participations: http://id.who.int/icd/entity/1394728112
  phenotypic_abnormality: HP:0000118

relations:
  affects: https://w3id.org/biolink/vocab/affects
  related_to: https://w3id.org/biolink/vocab/related_to

data_list_vars:
  orcid: xsd:anyURI

vars:
  structure: "'body_structures'"
  phenotype: "'phenotypic_abnormality'"
  activity: "'activities_participations'"

logical_axioms:

  - axiom_type: subClassOf
    text: "'affects' some %s"
    vars:
      - activity
  
  - axiom_type: subClassOf
    text: "'related_to' some %s"
    vars:
      - phenotype