pattern_name: phenotypes_pattern

pattern_iri: phenotypes_pattern.yaml

description: "Use this template to link the phenotypes to the relevant patient."

contributors:
  - https://orcid.org/0009-0000-5160-7927 # J. Potier

classes:
  phenotypic_abnormality: HP:0000118
  patient: PROMOT:3000001

relations:
  phenotype_of: RO:0002201
  related_to: https://w3id.org/biolink/vocab/related_to

annotationProperties:
  found_in: PROMOT:1000001

data_list_vars:
  orcid: xsd:anyURI

data_vars:
  source: xsd:string

vars:
  disease: "disease"
  anatomy: "anatomy"
  function: "function"
  structure: "structure"
  source: "source"
  phenotype: "phenotypic_abnormality"

annotations:
  - annotationProperty: found_in
    text: "%s"
    vars:
      - source
      
logical_axioms:

  - axiom_type: subClassOf
    text: "'phenotype_of' some %s"
    vars:
      - disease

  - axiom_type: subClassOf
    text: "'related_to' some %s"
    vars:
      - structure

  - axiom_type: subClassOf
    text: "'related_to' some %s"
    vars:
      - function