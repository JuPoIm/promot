pattern_name: statements_pattern

pattern_iri: statements_pattern.yaml

description: "Use this template to link a statement to the information content entity that is a member of that statement."

contributors:
  - https://orcid.org/0009-0000-5160-7927 # J. Potier

classes:
  information_content_entity: IAO:0000030
  statements: PROMOT:5000001

relations:
  has_member: RO:0002351

vars:
  information: "'information_content_entity'"

subClassOf:
  text: "'has_member' some %s"
  vars:
    - information