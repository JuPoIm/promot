pattern_name: activities_pattern

pattern_iri: http://purl.obolibrary.org/obo/promot/patterns/gene_disease_pattern.yaml

description: "Use this template to link the activities to the body functions and/or the body structures that affects them."

contributors:
  - https://orcid.org/0009-0000-5160-7927 # J. Potier

classes:
  activity: WHOFIC:1394728112
  function: WHOFIC:567313968
  structure: WHOFIC:1626363729

relations:
  affected_by: BIOLINK:affected_by

data_list_vars:
  orcid: xsd:anyURI

vars:
  function: "'function'"
  structure: "'structure'"
  activity: "'activity'"
      
logical_axioms:
  - axiom_type: equivalentTo
    text: "'activity' and 'affected_by' some %s"
    vars:
      - function

  - axiom_type: subClassOf
    text: "'affected_by' some %s"
    vars:
      - function

  - axiom_type: equivalentTo
    text: "'activity' and 'affected_by' some %s"
    vars:
      - structure
  
  - axiom_type: subClassOf
    text: "'affected_by some %s"
    vars:
      - structure