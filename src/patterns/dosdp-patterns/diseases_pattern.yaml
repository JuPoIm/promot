pattern_name: diseases_pattern

pattern_iri: diseases_pattern.yaml

description: "This template describes a disease by linking the disease to its related mutation and phenotypes."

classes:
  disease_pattern: MONDO:0000001
  phenotype: HP:0000118

relations:
  disease_has_feature: RO:0004029

vars:
  phenotype: "'phenotype'"
      
logical_axioms:

  - axiom_type: subClassOf
    text: "'disease_has_feature' some %s"
    vars:
      - phenotype