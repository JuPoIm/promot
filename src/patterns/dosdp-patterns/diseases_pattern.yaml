pattern_name: diseases_pattern

pattern_iri: diseases_pattern.yaml

description: "This template describes a disease by linking the disease to its related mutation, phenotypes and body structures."

classes:
  disease_pattern: MONDO:0000001
  structure: http://id.who.int/icd/entity/1626363729
  gene: SO:0000704
  phenotype: HP:0000118

relations:
  has_material_basis_in_mutation_in: RO:0004003
  has_phenotype: RO:0002200
  affects: https://w3id.org/biolink/vocab/affects

vars:
  phenotype: "phenotype"
  gene: "gene"
  structure: "structure"
  disease: "disease_pattern"
      
logical_axioms:
  # - axiom_type: equivalentTo
  #   text: "%s and 'has_material_basis_in_mutation_in' some %s"
  #   vars:
  #     - disease
  #     - gene
  
  - axiom_type: subClassOf
    text: "'has_material_basis_in_mutation_in' some %s"
    vars:
      - gene

  - axiom_type: subClassOf
    text: "'has_phenotype' some %s"
    vars:
      - phenotype

  # - axiom_type: equivalentTo
  #   text: "%s and 'has_phenotype' some %s"
  #   vars:
  #     - disease
  #     - phenotype

  - axiom_type: subClassOf
    text: "'affects' some %s"
    vars:
      - structure

  # - axiom_type: equivalentTo
  #   text: "%s and 'affects' some %s"
  #   vars:
  #     - disease
  #     - structure