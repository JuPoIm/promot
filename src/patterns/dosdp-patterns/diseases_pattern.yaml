pattern_name: diseases_pattern

pattern_iri: diseases_pattern.yaml

description: "Use this template to link a disease to its related phenotypes with the relation 'disease has feature'."

classes:
  disease: http://www.orpha.net/ORDO/Orphanet_377788
  phenotypic_abnormality: HP:0000118

relations:
  disease_has_feature: RO:0004029

vars:
  phenotype: "'phenotypic_abnormality'"
      
logical_axioms:

  - axiom_type: subClassOf
    text: "'disease_has_feature' some %s"
    vars:
      - phenotype