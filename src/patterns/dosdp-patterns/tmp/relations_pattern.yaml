pattern_name: relations_pattern

pattern_iri: http://purl.obolibrary.org/obo/promot/patterns/gene_disease_pattern.yaml

description: "Use this template to link the entities of the ontology to each other."

contributors:
  - https://orcid.org/0009-0000-5160-7927 # J. Potier

classes:
  - disease_pattern: MONDO:0000001
  - generically_dependent_continuant: BFO:0000031

relations:
  - is_causal_germline_mutation_in: RO:0004013
  - has_material_basis_in_mutation_in: RO:0004003
  - assay_measures_characteristic: RO:0009006
  - characteristic_measured_by_assay: RO:0009007
  - phenotype_of: RO:0002201
  - has_phenotype: RO:0002200
  - has_symptom: RO:0002452
  - related_to: BIOLINK:related_to
  - affects: BIOLINK:affects
  - affected_by: BIOLINK:affected_by
  - has_gene_mutation: VO:0001039

annotationProperties:
  found_in: PROMOT:A000001

data_list_vars:
  orcid: xsd:anyURI

data_vars:

vars:
  - disease: "'disease'"
  - phenotype: "'phenotype'"
  - gene: "'gene'"
  - test: "'test'"
  - function: "'function'"
  - structure: "'structure'"
  - activity: "'activity'"
  - source: "'source'"

annotations:
  - annotationProperty: found_in
    text: "%s "
    vars:
      - source
      
logical_axioms:
  - axiom_type: equivalentTo
    text: "'gene' and 'is_causal_germline_mutation_in' some %s"
    vars:
      - disease

  - axiom_type: subClassOf
    text: "'is_causal_germline_mutation_in' some %s"
    vars:
    - disease_pattern

  - axiom_type: equivalentTo
    text: "'gene' and 'has_material_basis_in_mutation_in' some %s"
    vars:
    - disease
  
  - axiom_type: subClassOf
    text: "'has_material_basis_in_mutation_in' some %s"
    vars:
    - disease
  
  - axiom_type: equivalentTo
    text: "'gene' and 'assay_measures_characteristic' some %s"
    vars:
    - disease
  
  - axiom_type: subClassOf
    text: "'assay_measures_characteristic' some %s"
    vars:
    - disease

  - axiom_type: equivalentTo
    text: "'gene' and 'characteristic_measured_by_assay' some %s"
    vars:
    - disease
  
  - axiom_type: subClassOf
    text: "'characteristic_measured_by_assay' some %s"
    vars:
    - disease

  - axiom_type: equivalentTo
    text: "'gene' and 'phenotype_of' some %s"
    vars:
    - disease
  
  - axiom_type: subClassOf
    text: "'phenotype_of' some %s"
    vars:
    - disease
  
  - axiom_type: subClassOf
    text: "'has_phenotype' some %s"
    vars:
    - disease

  - axiom_type: equivalentTo
    text: "'gene' and 'has_phenotype' some %s"
    vars:
    - disease
  - axiom_type: subClassOf
    text: "'has_symptom' some %s"
    vars:
    - disease
  - axiom_type: equivalentTo
    text: "'gene' and 'has_symptom' some %s"
    vars:
    - disease
  - axiom_type: subClassOf
    text: "'related_to' some %s"
    vars:
    - disease
  - axiom_type: equivalentTo
    text: "'gene' and 'related_to' some %s"
    vars:
    - disease

  - axiom_type: subClassOf
    text: "'affects' some %s"
    vars:
    - disease
  - axiom_type: equivalentTo
    text: "'gene' and 'affects' some %s"
    vars:
    - disease

  - axiom_type: subClassOf
    text: "'affected_by' some %s"
    vars:
    - disease
  - axiom_type: equivalentTo
    text: "'gene' and 'affected_by' some %s"
    vars:
    - disease

  - axiom_type: subClassOf
    text: "'has_gene_mutation' some %s"
    vars:
    - disease
  - axiom_type: equivalentTo
    text: "'gene' and 'has_gene_mutation' some %s"
    vars:
    - disease