pattern_name: structures_pattern

pattern_iri: http://purl.obolibrary.org/obo/promot/patterns/gene_disease_pattern.yaml

description: "Use this template to link the body structures to the body functions and activities they affect."

contributors:
  - https://orcid.org/0009-0000-5160-7927 # J. Potier

classes:
  structure: WHOFIC:1626363729
  function: WHOFIC:567313968
  activity: WHOFIC:1394728112
  disease: mondo:0000001

relations:
  affects: BIOLINK:affects
  affected_by: BIOLINK:affected_by

data_list_vars:
  orcid: xsd:anyURI

vars:
  structure: "'structure'"
  disease: "'disease'"
  function: "'function'"
  activity: "'activity'"

logical_axioms:
  - axiom_type: equivalentTo
    text: "'structure' and 'affects' some %s"
    vars:
      - activity

  - axiom_type: subClassOf
    text: "'affects' some %s"
    vars:
      - activity

  - axiom_type: equivalentTo
    text: "'structure' and 'affects' some %s"
    vars:
      - function

  - axiom_type: subClassOf
    text: "'affects' some %s"
    vars:
      - function

  - axiom_type: equivalentTo
    text: "'structure' and 'affected_by' some %s"
    vars:
      - disease
  
  - axiom_type: subClassOf
    text: "'affected_by' some %s"
    vars:
      - disease