pattern_name: gene_disease_pattern
pattern_iri: http://purl.obolibrary.org/obo/promot/patterns/gene_disease_pattern.yaml

description: "
  Captures the relations between genes and diseases."

classes:
  disease_pattern: MONDO:0000001
  generically_dependent_continuant: BFO:0000031

relations:
  is_causal_germline_mutation_in: RO:0004013

vars:
  disease_pattern: "'disease_pattern'"

equivalentTo:
  text: "'generically_dependent_continuant' and 'is_causal_germline_mutation_in' some %s"
  vars:
    - disease_pattern

subClassOf:
  text: "'is_causal_germline_mutation_in' some %s"
  vars:
    - disease_pattern