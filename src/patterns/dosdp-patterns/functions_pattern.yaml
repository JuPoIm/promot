pattern_name: functions_pattern

pattern_iri: functions_pattern.yaml

description: "Use this template to link the body functions to the phenotypes and activities and participation they are related to, the body function being the subject of the relation."

contributors:
  - https://orcid.org/0009-0000-5160-7927 # J. Potier

classes:
  body_function: http://id.who.int/icd/entity/567313968
  phenotypic_abnormality: HP:0000118
  activities_participation: http://id.who.int/icd/entity/1394728112

relations:
  involved_in: http://purl.obolibrary.org/obo/RO_0002331
  is_related_to: SIO:000001

vars:
  phenotype: "'phenotypic_abnormality'"
  activity: "'activities_participation'"


logical_axioms:

  - axiom_type: subClassOf
    text: "'involved_in' some %s"
    vars:
      - activity
  
  - axiom_type: subClassOf
    text: "'is_related_to' some %s"
    vars:
      - phenotype