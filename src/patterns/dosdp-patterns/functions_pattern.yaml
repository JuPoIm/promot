pattern_name: functions_pattern

pattern_iri: functions_pattern.yaml

description: "Use this template to link the body functions to the body structures that affect them and to the activities they affect."

contributors:
  - https://orcid.org/0009-0000-5160-7927 # J. Potier

classes:
  function: http://id.who.int/icd/entity/567313968
  structure: http://id.who.int/icd/entity/1626363729
  activity: http://id.who.int/icd/entity/1394728112

relations:
  affects: https://w3id.org/biolink/vocab/affects
  affected_by: https://w3id.org/biolink/vocab/affected_by

data_list_vars:
  orcid: xsd:anyURI

vars:
  function: "function"
  structure: "structure"
  activity: "activity"

logical_axioms:
  # - axiom_type: equivalentTo
  #   text: "'function' and 'affects' some %s"
  #   vars:
  #     - activity

  - axiom_type: subClassOf
    text: "'affects' some %s"
    vars:
      - activity

  # - axiom_type: equivalentTo
  #   text: "'function' and 'affected_by' some %s"
  #   vars:
  #     - structure
  
  - axiom_type: subClassOf
    text: "'affected_by' some %s"
    vars:
      - structure