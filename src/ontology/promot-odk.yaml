#### GENERAL INFORMATIONS
id: promot
title: "PROMOT ontology"
github_org: JuPoIm
git_main_branch: main
repo: promot_ontology
contact: juliette.potier@institutimagine.org
description: "Ontology of the PROMOT initiative for modeling three neuromuscular diseases: Oculopharyngeal Muscular Dystrophy, Congenital Myopathies and Congenital Myastenic Syndroms. It also aims to be the conceptual schema for building the PROMOT initiative relational database."
license: "https://creativecommons.org/licenses/by-nc-sa/4.0/"
documentation:
  documentation_system: mkdocs
#### RELEASE CONFIG
release_artefacts:
  - base
  - full
  - non-classified
  - simple
primary_release: full
release_date: TRUE
export_formats:
  - owl
  - obo
  - json
### REASONER
reasoner: ELK
#### USE CONFIG
use_context: TRUE # uses context.json file for prefixes
use_template: TRUE # uses ROBOT templates for creating PROMOT specific classes, properties and axioms
use_mappings: TRUE # uses SSSOM mapping files to map entities used in PROMOT to already existing equivalents
#### SSSOM CONFIG
sssom_mappingset_group:
  products:
    - id: promot-mappings
    - id: icf-to-cif_promot-mappings
    - id: icf-to-cif_all-mappings
  release_mappings: TRUE
#### BRIDGE CONFIG
# bridge_group:
#   products:
#     - id: promot-bridge
#### COMPONENTS CONFIG
components:
  release_components: TRUE
  products:
    - filename: promot-component.owl
      use_template: TRUE
      template_options: --add-prefixes config/context.json
      templates:
        - promot-component-auto.tsv
      use_mappings: TRUE
      mappings:
        - promot-mappings.sssom.tsv
        - icf-to-cif_promot-mappings.sssom.tsv
#### IMPORTS CONFIG
import_group:
  annotation_properties:
    - rdfs:label
    - rdfs:comment
    - dc:description
    - dc:source
    - dc:date
    - dcterms:creator
    - oboInOwl:hasDbXref
    - IAO:0000112 # exemple of usage
    - IAO:0000115 # definition
    - IAO:0000116 # editor note
    - IAO:0000117 # term editor
    - IAO:0000119 # definition source
    - IAO:0000412 # imported from
  release_imports: FALSE
  module_type: custom
  products:
    - id: bfo # high-level classes
    - id: eco # evidence classes
    - id: fma # anatomy classes
      mirror_from: http://purl.org/sig/ont/fma.owl
    - id: hp # phenotypic abnormality classes
    - id: iao # information content entity classes
      module_type: filter
    - id: icf # body structures/functions, activities and participation classes
      mirror_type: no_mirror # manual download required from https://raw.githubusercontent.com/whoficitc/harmonization/main/ontology/whofic-2025-05-24.owl (or later version)
    - id: ncit
      is_large: TRUE
    - id: ordo # diseases classes ORDO
      mirror_from: https://www.orphadata.com/data/ontologies/ordo/last_version/ORDO_en_4.8.owl
    - id: ro # OP
    - id: snomed # See promot.Makefile and src/data/README.md for details
      is_large: TRUE
      mirror_type: no_mirror # manual downloads required from https://www.nlm.nih.gov/healthit/snomedct/international.html & https://smt.esante.gouv.fr/terminologie-snomed-ct-fr/
    - id: so
      module_type: filter
#### ROBOT CONFIG
robot_java_args: '-Xmx25G'
robot_report:
  use_labels: TRUE
  fail_on: NULL
  custom_profile: FALSE
  report_on: 
    - edit