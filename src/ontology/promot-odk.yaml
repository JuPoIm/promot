id: promot
title: "PROMOT Common Data Model ontology"
github_org: JuPoIm
git_main_branch: main
repo: promot_ontology
contact: juliette.potier@institutimagine.org
# creators:
#   - "Juliette Potier"
# contributors:
#   - "Juliette Potier"
#   - "Paul Fabry"
#   - "Christina Khnaisser"
#   - "Anita Burgun"
#   - "Cynthia Gagnon"
#   - "Carole Faviez"
#   - "Elizabeth Angelevski"
#   - "Mansoore Gholizade"
description: "Ontology for building the relational database of the PROMOT project"
release_artefacts:
  - base
  - full
  - simple
primary_release: full
release_date: TRUE
export_formats:
  - owl
  - obo
  - json
license: https://creativecommons.org/licenses/unspecified
use_template: TRUE
use_dosdps: TRUE
components:
  release_components: TRUE
  products:
    - filename: PROMOT_classes_relations.owl
      use_template: TRUE
      template_options: --add-prefixes config/context.json
      templates:
        - PROMOT-classes-relations.csv
import_group:
  annotation_properties:
    - rdfs:label
    - rdfs:comment
    - dc:description
    - dc:source
    - oboInOwl:hasDbXref
    - IAO:0000111
    - IAO:0000112
    - IAO:0000115
    - IAO:0000116
    - IAO:0000117
    - IAO:0000118
    - IAO:0000119
    - IAO:0000412
  release_imports: TRUE
  products:
    - id: bfo # high-level classes
      module_type: custom
    - id: bioassay # mutated ?
      mirror_from: http://www.bioassayontology.org/bao/bao_complete.owl
    - id: biolink # relations
      mirror_from: https://w3id.org/biolink/biolink-model.owl.ttl
      mirror_type: custom
    - id: efo # to delete ?
      mirror_from: http://www.ebi.ac.uk/efo/efo.owl
    - id: fma # anatomy
      module_type: custom
    - id: hp # phenotypes
      module_type: custom
    - id: mondo # diseases
      module_type: custom
      is_large: TRUE
    - id: ncit # genes, tests, devices
      is_large: TRUE
    - id: orcidio # code orcid, to delete ?
      mirror_from: https://w3id.org/orcidio/orcidio.owl
      module_type: filter
      base_iris:
        - https://orcid.org/
    - id: obi # to delete ?
    - id: ro # relations
      module_type: custom
    - id: scdo # measures relation
    - id: sio # biological quality
      module_type: custom
    - id: snomed # tests, devices
      is_large: TRUE
      module_type: custom
    - id: so # 'gene'
      is_large: TRUE
      module_type: custom
    - id: vo # has gene mutation
    - id: whofic # body structures, functions, activities
      mirror_from: https://raw.githubusercontent.com/whoficitc/harmonization/main/ontology/whofic-2024-01-21.owl
      module_type: custom
robot_java_args: '-Xmx8G'
robot_report:
  use_labels: TRUE
  fail_on: ERROR
  custom_profile: TRUE
  report_on: 
    - edit