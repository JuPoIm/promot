id: promot
title: "PROMOT Common Data Model ontology"
github_org: JuPoIm
git_main_branch: main
repo: promot_ontology
contact: juliette.potier@institutimagine.org
# creators:
#   - "Juliette Potier"
# contributors:
#   - "Juliette Potier"
#   - "Paul Fabry"
#   - "Christina Khnaisser"
#   - "Anita Burgun"
#   - "Cynthia Gagnon"
#   - "Carole Faviez"
#   - "Elizabeth Angelevski"
#   - "Mansoore Gholizade"
description: "Ontology for building the relational database of the PROMOT project"
release_artefacts:
  - base
  - full
  - simple
primary_release: full
release_date: TRUE
export_formats:
  - owl
  - obo
  - json
#license: https://creativecommons.org/licenses/unspecified
documentation:
  documentation_system: mkdocs
use_template: TRUE
use_dosdps: TRUE
components:
  release_components: TRUE
  products:
    - filename: promot_onto.owl
      use_template: TRUE
      template_options: --add-prefixes config/context.json
      templates:
        - promot_onto.csv
import_group:
  annotation_properties:
    - rdfs:label
    - rdfs:comment
    - dc:description
    - dc:source
    - oboInOwl:hasDbXref
    - IAO:0000111
    - IAO:0000112
    - IAO:0000115
    - IAO:0000116
    - IAO:0000117
    - IAO:0000118
    - IAO:0000119
    - IAO:0000412
  release_imports: TRUE
  module_type: custom
  products:
    - id: bfo # high-level classes
    - id: fma # anatomy
    - id: hp # phenotypes
    - id: iao
      module_type: filter
    - id: mondo # diseases
      is_large: TRUE
    - id: ncit # genes, tests, devices
      is_large: TRUE
    - id: obi
    - id: orcidio # code orcid, to delete ?
      mirror_from: https://w3id.org/orcidio/orcidio.owl
      module_type: filter
      base_iris:
        - https://orcid.org/
    - id: ro # relations
    - id: scdo # measures relation
    - id: sio # life status, parental transmission
    - id: snomed # tests, devices
      is_large: TRUE
    - id: vo # has gene mutation
    - id: whofic # body structures, functions, activities
      mirror_from: https://raw.githubusercontent.com/whoficitc/harmonization/main/ontology/whofic-2024-01-21.owl
robot_java_args: '-Xmx25G'
robot_report:
  use_labels: TRUE
  fail_on: ERROR
  custom_profile: TRUE
  report_on: 
    - edit