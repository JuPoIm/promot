id: promot
title: "PROMOT Common Data Model ontology"
github_org: JuPoIm
git_main_branch: main
repo: promot_ontology
contact: juliette.potier@institutimagine.org
description: "Ontology for building the relational database of the PROMOT project"
release_artefacts:
  - base
  - full
  - simple
primary_release: full
release_date: TRUE
export_formats:
  - owl
  - obo
  - json
license: https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr
documentation:
  documentation_system: mkdocs
use_dosdps: TRUE # PROMOT axioms
use_template: TRUE # PROMOT classes, properties and axioms
components:
  release_components: TRUE
  products:
    - filename: promot_onto.owl
      use_template: TRUE
      template_options: --add-prefixes config/context.json
      templates:
        - promot_onto.csv
import_group:
  annotation_properties:
    - rdfs:label
    - rdfs:comment
    - dc:description
    - dc:source
    - oboInOwl:hasDbXref
    - IAO:0000111
    - IAO:0000112
    - IAO:0000115
    - IAO:0000116
    - IAO:0000117
    - IAO:0000118
    - IAO:0000119
    - IAO:0000412
  release_imports: TRUE
  module_type: custom
  products:
    - id: bfo # high-level classes
    - id: fma # anatomy classes
    - id: hp # phenotypes classes
    - id: iao # information content entity class
      module_type: filter
    - id: mondo # diseases classes
      is_large: TRUE
    - id: obi # 'Organism' and 'Homo sapiens' classes
    - id: ro # object properties
    - id: scdo # 'measures' object property
    - id: sio # life status, parental transmission
    - id: snomed # tests, devices
      is_large: TRUE
    - id: vo # 'has gene mutation' object property
    - id: whofic # body structures, functions, activities classes
      mirror_from: https://raw.githubusercontent.com/whoficitc/harmonization/main/ontology/whofic-2024-01-21.owl
robot_java_args: '-Xmx25G'
robot_report:
  use_labels: TRUE
  fail_on: ERROR
  custom_profile: TRUE
  report_on: 
    - edit