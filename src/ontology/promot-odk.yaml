#### GENERAL INFORMATIONS
id: promot
title: "PROMOT ontology"
github_org: JuPoIm
git_main_branch: main
repo: promot_ontology
contact: juliette.potier@institutimagine.org
description: "Ontology for modeling the three following neuromuscular diseases : OPMD, Congenital myopathies and Congenital myastenic syndroms. It aims to be also an ontology for building the PROMOT project relational database."
license: "https://creativecommons.org/licenses/by-nc-sa/4.0/"
documentation:
  documentation_system: mkdocs
#### RELEASE CONFIG
release_artefacts:
  - base
  - full
  - simple
primary_release: full
release_date: TRUE
export_formats:
  - owl
  - obo
  - json
#### USE CONFIG
use_context: TRUE # uses context.json file for prefixes
#use_dosdps: TRUE # uses Dead Simple Owl Design Patterns for creating PROMOT axioms
use_template: TRUE # uses ROBOT templates for creating PROMOT classes, properties and axioms
use_mappings: TRUE # uses SSSOM mapping files
#### HOMEMADE SSSOM MODULE
sssom_mappingset_group:
  products:
    - id: promot-mappings
    - id: icf-to-cif_promot-mappings
    - id: icf-to-cif_all-mappings
  release_mappings: TRUE
# bridge_group:
#   products:
#     - id: promot-bridge
#       sources:
#         - promot-mappings
#     - id: icf-cif-fr-bridge
#       sources:
#         - icf-to-cif_all-mappings
#   release_bridges: TRUE
#  http://purl.obolibrary.org/obo/ro/bridge/sio-ro-bridge.owl
#### HOMEMADE MODULE
components:
  release_components: TRUE
  products:
    - filename: promot-component.owl
      use_template: TRUE
      template_options: --add-prefixes config/context.json
      templates:
        - promot-component-test.tsv
      use_mappings: TRUE
      mappings:
        - promot-mappings.sssom.tsv
        - icf-to-cif_promot-mappings.sssom.tsv
#### IMPORTED MODULES
import_group:
  annotation_properties:
    - rdfs:label
    - rdfs:comment
    - dc:description
    - dc:source
    - dc:date
    - dcterms:creator
    - oboInOwl:hasDbXref
    - IAO:0000115 # definition
    - IAO:0000116 # editor note
    - IAO:0000117 # term editor
    - IAO:0000119 # definition source
    - IAO:0000412 # imported from
  release_imports: FALSE
  module_type: custom
  products:
    - id: bfo # high-level classes
    - id: eco # evidence classes
    - id: fma # anatomy classes
      mirror_from: http://purl.org/sig/ont/fma.owl
    - id: hp # phenotypic abnormality classes
    - id: iao # information content entity classes
      module_type: filter
    - id: icf # body structures, functions, activities classes
      mirror_from: https://raw.githubusercontent.com/whoficitc/harmonization/main/ontology/whofic-2025-05-24.owl
    - id: ordo # diseases classes ORDO
      mirror_from: https://www.orphadata.com/data/ontologies/ordo/last_version/ORDO_en_4.8.owl
    - id: ro # object properties
    - id: sio # life status, parental transmission, object properties
      mirror_type: no_mirror
    - id: snomed # See promot.Makefile for details
      is_large: TRUE
      mirror_type: no_mirror
#### ROBOT CONFIG
robot_java_args: '-Xmx25G'
robot_report:
  use_labels: TRUE
  fail_on: NULL
  custom_profile: FALSE
  report_on: 
    - edit