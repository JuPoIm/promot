id: promot
title: "PROMOT Common Data Model ontology"
github_org: JuPoIm
git_main_branch: main
repo: promot_ontology
contact: juliette.potier@institutimagine.org
contributors:
  - "Juliette Potier"
  - "Paul Fabry"
  - "Christina Khnaisser"
  - "Anita Burgun"
  - "Cynthia Gagnon"
creators:
  - "Juliette Potier"
description: "Ontology for building the relational database of the PROMOT project"
release_artefacts:
  - base
  - full
  - simple
primary_release: full
release_date: TRUE
export_formats:
  - owl
  - obo
  - json
license: https://creativecommons.org/licenses/unspecified
import_group:
  annotation_properties:
    - rdfs:label
    - dc:description
    - dc:source
  release_imports: TRUE
  products:
    - id: bfo
      module_type: custom
    - id: mondo
      module_type: filter
    - id: orcidio
      mirror_from: https://w3id.org/orcidio/orcidio.owl
      module_type: filter
      base_iris:
        - https://orcid.org/
    - id: fma
      mirror_type: custom
      module_type: custom
    - id: hp
      module_type: custom
    - id: whofic
      mirror_from: https://raw.githubusercontent.com/whoficitc/harmonization/main/ontology/whofic-2024-01-21.owl
      module_type: custom
    - id: snomed
      module_type: custom
    - id: ro
      module_type: custom
    - id: biolink
      mirror_from: https://w3id.org/biolink/biolink-model.owl.ttl
      module_type: custom
    - id: ncit
      module_type: custom
    - id: obi
      module_type: custom
    - id: efo
      mirror_from: http://www.ebi.ac.uk/efo/efo.owl
      module_type: custom
robot_java_args: '-Xmx8G'
robot_report:
  use_labels: TRUE
  fail_on: ERROR
  custom_profile: TRUE
  report_on:
    - edit
