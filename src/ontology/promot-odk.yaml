id: promot
title: "PROMOT Common Data Model ontology"
github_org: JuPoIm
git_main_branch: main
repo: promot_ontology
contact: juliette.potier@institutimagine.org
# creators:
#   - "Juliette Potier"
# contributors:
#   - "Juliette Potier"
#   - "Paul Fabry"
#   - "Christina Khnaisser"
#   - "Anita Burgun"
#   - "Cynthia Gagnon"
#   - "Carole Faviez"
#   - "Elizabeth Angelevski"
#   - "Mansoore Gholizade"
description: "Ontology for building the relational database of the PROMOT project"
release_artefacts:
  - base
  - full
  - simple
primary_release: full
release_date: TRUE
export_formats:
  - owl
  - obo
  - json
license: https://creativecommons.org/licenses/unspecified
use_template: TRUE
use_dosdps: TRUE
components:
  release_components: TRUE
  products:
    - filename: relations_newclasses.owl
      use_template: TRUE
      template_options: --add-prefixes config/context.json
      templates:
        - disease_gene.csv
        - disease_pheno.csv
        - disease_structure.csv
        - function_activity.csv
        - function_structure.csv
        - patient_classes.csv
        - pheno_anatomy.csv
        - pheno_function.csv
        - procedure_activity.csv
        - procedure_function.csv       
#        - anatomy_structure.csv
import_group:
  annotation_properties:
    - rdfs:label
    - rdfs:comment
    - dc:description
    - dc:source
    - oboInOwl:hasDbXref
    - IAO:0000111
    - IAO:0000112
    - IAO:0000115
    - IAO:0000116
    - IAO:0000117
    - IAO:0000118
    - IAO:0000119
    - IAO:0000412
  release_imports: TRUE
  products:
    - id: bfo
      module_type: custom
    - id: bioassay
      mirror_from: http://www.bioassayontology.org/bao/bao_complete.owl
    - id: biolink
      mirror_from: https://w3id.org/biolink/biolink-model.owl.ttl
    - id: efo
      mirror_from: http://www.ebi.ac.uk/efo/efo.owl
    - id: fma
      module_type: custom
    - id: hp
      module_type: custom
    - id: ioio
    - id: mondo
      module_type: custom
      is_large: TRUE
    - id: ncit
      is_large: TRUE
    - id: orcidio
      mirror_from: https://w3id.org/orcidio/orcidio.owl
      module_type: filter
      base_iris:
        - https://orcid.org/
    - id: obi
    - id: ro
      module_type: custom
    - id: scdo
    - id: snomed
      is_large: TRUE
      module_type: custom
    - id: so
      is_large: TRUE
      module_type: custom
    - id: vo
    - id: whofic
      mirror_from: https://raw.githubusercontent.com/whoficitc/harmonization/main/ontology/whofic-2024-01-21.owl
      module_type: custom
robot_java_args: '-Xmx8G'
robot_report:
  use_labels: TRUE
  fail_on: ERROR
  custom_profile: TRUE
  report_on: 
    - edit